<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F3864">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>選挙情報管理</title>
<style>
  :root{
    --navy:#1F3864; --navy2:#2E5496; --bg:#EEF2F8; --card:#FFFFFF;
    --line:#C8D2E4; --text:#1A2333; --sub:#5A6B8C; --red:#B5403B;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg); color:var(--text); font-size:15px;
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ===== 上部帯 ===== */
  .band{
    background:var(--navy); color:#fff;
    padding:calc(18px + env(safe-area-inset-top)) 16px 20px;
  }
  .band .in{max-width:760px; margin:0 auto; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .band h1{font-size:20px; font-weight:700; letter-spacing:.08em;}
  .band .today{font-size:13px; color:#C9D6EE; margin-left:auto;}

  main{max-width:760px; margin:0 auto; padding:16px 12px 28px;}

  /* ===== メイン6ボタン ===== */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (min-width:640px){ .grid{grid-template-columns:1fr 1fr 1fr; gap:12px;} }
  .tile{
    position:relative; display:flex; flex-direction:column; gap:6px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 14px 14px 18px; min-height:132px;
    color:var(--text); text-decoration:none; overflow:hidden;
  }
  .tile::before{                       /* 機能ごとの色帯 */
    content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--c);
  }
  .tile:active{background:#E9EFFA;}
  .tile:focus-visible{outline:3px solid var(--navy2); outline-offset:2px;}
  .tile .ico{font-size:28px; line-height:1;}
  .tile .name{font-size:17px; font-weight:700; color:var(--navy); letter-spacing:.03em;}
  .tile .desc{font-size:12px; color:var(--sub); line-height:1.6;}

  /* ===== PC・管理用リンク ===== */
  .sub-h{font-size:13px; font-weight:700; color:var(--navy); margin:22px 2px 8px;}
  .links{display:flex; gap:8px; flex-wrap:wrap;}
  .links a{
    display:inline-flex; align-items:center; gap:6px;
    background:#fff; border:1.5px solid var(--navy); color:var(--navy);
    border-radius:8px; padding:10px 14px; font-size:13px; font-weight:700; text-decoration:none;
  }
  .links a:active{background:#E9EFFA;}
  .links a:focus-visible{outline:3px solid var(--navy2); outline-offset:2px;}

  /* ===== パスコード ===== */
  #gate{position:fixed; inset:0; z-index:1400; background:var(--navy);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px;}
  #gate h1{color:#fff; font-size:18px; letter-spacing:.1em;}
  #gate input{font-size:20px; padding:12px; border-radius:8px; border:none; text-align:center; width:220px; letter-spacing:.2em;}
  #gate .btn{border:none; border-radius:8px; font-weight:700; font-size:15px;
    padding:13px 28px; cursor:pointer; color:var(--navy); background:#fff;}
  #gate .msg{color:#FFC7C2; font-size:13px; min-height:1.2em;}
</style>
</head>
<body>

<!-- ===== 簡易パスコードゲート（全画面共通の poster_gate を使用） ===== -->
<div id="gate">
  <h1>選挙情報管理</h1>
  <input id="gateInput" type="password" placeholder="パスコード" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="btn" onclick="checkGate()">開く</button>
  <div class="msg" id="gateMsg"></div>
</div>

<div class="band">
  <div class="in">
    <h1>選挙情報管理</h1>
    <span class="today" id="today"></span>
  </div>
</div>

<main>
  <nav class="grid" aria-label="メニュー">
    <a class="tile" href="poster.html" style="--c:#D93025">
      <span class="ico">&#128247;</span>
      <span class="name">ビラ・ポスター</span>
      <span class="desc">ポスター・地域掲示板の撮影と地図表示</span>
    </a>
    <a class="tile" href="meibo.html" style="--c:#7CB342">
      <span class="ico">&#128101;</span>
      <span class="name">名簿</span>
      <span class="desc">名刺のAI読み取り結果と後援者の名簿</span>
    </a>
    <a class="tile" href="enzetsu.html" style="--c:#2E5496">
      <span class="ico">&#128226;</span>
      <span class="name">街頭演説</span>
      <span class="desc">演説の場所・時間・配布数を記録</span>
    </a>
    <a class="tile" href="events.html" style="--c:#F4C513">
      <span class="ico">&#128197;</span>
      <span class="name">イベント情報</span>
      <span class="desc">地域の催しを自動で集めてカレンダーへ</span>
    </a>
    <a class="tile" href="rivals.html" style="--c:#757575">
      <span class="ico">&#128269;</span>
      <span class="name">他候補ウォッチ</span>
      <span class="desc">競合候補の日々の活動を要約</span>
    </a>
    <a class="tile" href="receipt.html" style="--c:#266489">
      <span class="ico">&#129534;</span>
      <span class="name">収支報告書</span>
      <span class="desc">領収書を撮影して収支を登録</span>
    </a>
  </nav>

  <h2 class="sub-h">PC・管理用</h2>
  <div class="links">
    <a href="posters.html">&#128203; ポスター一覧（表形式）</a>
    <a href="map.html">&#128506; 選挙情報マップ（PC）</a>
  </div>
</main>

<script>
const PASSCODE = "sano2026";      // 他の画面と共通（""で無効化）
const $ = id => document.getElementById(id);

function checkGate(){
  if($("gateInput").value === PASSCODE){
    localStorage.setItem("poster_gate","ok");
    $("gate").style.display="none";
  }else{
    $("gateMsg").textContent="パスコードが違います";
  }
}
if(!PASSCODE || localStorage.getItem("poster_gate")==="ok"){
  $("gate").style.display="none";
}
$("gateInput").addEventListener("keydown", e=>{ if(e.key==="Enter") checkGate(); });

/* 日付表示 */
(function(){
  const d=new Date(), w="日月火水木金土"[d.getDay()];
  $("today").textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
})();
</script>
</body>
</html>
